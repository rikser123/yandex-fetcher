spring:
  main:
    allow-bean-definition-overriding: true
  config:
    import: classpath:logbook.yml
  application:
    name: rikser-yandex-fetcher
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_URL}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      schema: rikser-yandex-fetcher
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS "rikser-yandex-fetcher"
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
    default-schema: rikser-yandex-fetcher
    liquibase-schema: rikser-yandex-fetcher
    drop-first: false
  cloud:
    compatibility-verifier:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_URL}
    consumer:
      group-id: fetcher

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

bundle:
  security:
    enabled: true
    service:
      enabled: true
      url: ${SECURITY_URL}
  kafka:
    enabled: true
    user: ${KAFKA_USER}
    password: ${KAFKA_PASSWORD}
    kafka-url: ${KAFKA_URL}
    max-fetch-limit: 200

management:
  tracing:
    enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    health:
      show-details: always
      status:
        http-mapping:
          down: 503

yandex:
  token: ${YANDEX_TOKEN}
  search-api-url: ${YANDEX_SEARCH_API_URL}
  operation-api-url: ${YANDEX_OPERATION_API_URL}
  speller-api: ${YANDEX_SPELLER_API_URL}
  max-attempts: 4
  delay: 500
  exclude-domains: ${EXCLUDE_DOMAINS:vk.com,pikabu.ru,rutube.ru,youtube.com,yandex.ru,mail.ru}
  pool-size: ${YANDEX_POOL_SISE:100}
  queue-size: ${YANDEX_QUEUE_SISE:300}
  scheduler-delay: PT10S

schedulers:
  kafka:
    delay: PT10S
  analysis:
    delay: PT1M

logbook:
  predicate:
    exclude:
      - path: /api/v1/user/public-key
      - path: /actuator/**

